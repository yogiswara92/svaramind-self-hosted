services:
  postgres:
    image: postgres:16-alpine
    container_name: svaramind-local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: svaramind_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - svaramind_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional object storage backend. Not started by default - only needed if
  # the admin picks "MinIO" as the storage provider in Admin Settings.
  # Start it with: docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    container_name: svaramind-local-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - svaramind_local_miniodata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svaramind-local-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/svaramind_local
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  svaramind_local_pgdata:
  svaramind_local_miniodata:
